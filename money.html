</head><body><header class="top"><div class="topin"><div class="brand">Cuebook</div><div class="tag">Money</div><span class="spacer"></span><nav class="menu"><a href="index.html?v=json-b306">Dashboard</a><a href="castbook.html?v=json-b306">Cast Book</a><a href="companions.html?v=json-b306">Companions</a></nav></div></header><main class="wrap" id="app"><div class="hero"><h1>Money</h1><p class="subtitle">Loading the receipts without turning theatre-going into an accounting seminar…</p></div></main><script>
const NOW='2026-09-21',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const show=p=>DB.shows?.[String(p.showId)]?.title||'Unknown show';
function amount(p){if(typeof p.ticketPrice==='number'&&Number.isFinite(p.ticketPrice))return p.ticketPrice;if(typeof p.price==='number'&&Number.isFinite(p.price))return p.price;if(typeof p.performanceMetadata?.pricePaid==='number'&&Number.isFinite(p.performanceMetadata.pricePaid))return p.performanceMetadata.pricePaid;let raw=String(p.performanceMetadata?.pricePaid??'').trim();if(raw){let n=Number(raw.replace(/[^0-9.-]/g,''));if(Number.isFinite(n))return n}return null}
function currencyNorm(p){if(p.ticketCurrency)return String(p.ticketCurrency).toUpperCase();let evidence=[p.price,p.notes,p.ticketNotes,p.performanceMetadata?.pricePaid].filter(v=>v!==null&&v!==undefined).join(' ');if(/£/.test(evidence))return'GBP';if(/\$/.test(evidence))return'USD';if(/€/.test(evidence))return'EUR';return amount(p)!==null?'Unspecified':'Unpriced'}
function money(n,c=filters.currency){if(!Number.isFinite(n))return'–';if(c==='Unspecified')return n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})+' (currency unspecified)';try{return n.toLocaleString(undefined,{style:'currency',currency:c,maximumFractionDigits:2})}catch{return n.toFixed(2)+' '+c}}
function ticketNorm(p){let t=String(p.ticketType||'').trim();let tags=Array.isArray(p.tags)?p.tags.join(' '):String(p.tags||'');let markers=[...(Array.isArray(p.experienceMarkers)?p.experienceMarkers:[]),tags].join(' ');if(/comp|free/i.test(t+' '+markers)||amount(p)===0)return'Comp / Free';if(/rush/i.test(t+' '+markers))return'Rush';if(/lottery/i.test(t+' '+markers))return'Lottery';if(/tdf/i.test(t))return'TDF';return t||'Other / Unknown'}
function sourceNorm(p){return String(p.ticketSource||p.performanceMetadata?.ticketSource||'').trim()||'Unknown'}
function prodNorm(p){let t=String(p.type||'Other');if(/^Broadway$/i.test(t))return'Broadway';if(/Off-Broadway|Off Broadway/i.test(t))return'Off-Broadway';if(/Regional/i.test(t))return'Regional';return'Other'}
function priced(p){return amount(p)!==null}function isPaid(p){return priced(p)&&amount(p)>0}function isComp(p){return ticketNorm(p)==='Comp / Free'}
function allPerfs(){return vals(DB.performances).filter(p=>p.date)}
function filteredBase(){return allPerfs().filter(p=>(filters.year==='all'||String(p.date).slice(0,4)===filters.year)&&(filters.show==='all'||String(p.showId)===filters.show)&&(filters.ticket==='all'||ticketNorm(p)===filters.ticket)&&(filters.source==='all'||sourceNorm(p)===filters.source)&&(filters.type==='all'||prodNorm(p)===filters.type))}
function options(rows,get,val,allLabel='All'){let a=[...new Set(rows.map(get).filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y)));return `<option value="all">${esc(allLabel)}</option>`+a.map(x=>`<option value="${esc(x)}"${String(x)===String(val)?' selected':''}>${esc(x)}</option>`).join('')}
function barChart(items,value,label,format=money,limit=12){let rows=items.slice(0,limit),mx=Math.max(1,...rows.map(value));return rows.length?rows.map(x=>`<div class="barRow"><div class="barLabel" title="${esc(label(x))}">${esc(label(x))}</div><div class="barTrack"><div class="barFill" style="width:${Math.max(1,value(x)/mx*100)}%"></div></div><div class="barValue">${esc(format(value(x)))}</div></div>`).join(''):'<div class="empty">No matching recorded-price data.</div>'}
function cumulativeSVG(rows){let paid=rows.filter(isPaid).sort((a,b)=>String(a.date).localeCompare(String(b.date)));if(!paid.length)return'<div class="empty">No paid price data in this currency/filter.</div>';let monthly=new Map(),cum=0;paid.forEach(p=>monthly.set(String(p.date).slice(0,7),(monthly.get(String(p.date).slice(0,7))||0)+amount(p)));let pts=[...monthly].map(([k,v])=>{cum+=v;return[k,cum]});let max=pts.at(-1)[1]||1,w=900,h=200,pad=18,coords=pts.map((x,i)=>[pad+(pts.length===1?0:i/(pts.length-1)*(w-pad*2)),h-pad-x[1]/max*(h-pad*2)]),d=coords.map((c,i)=>(i?'L':'M')+c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ');return `<svg class="lineChart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Cumulative known spend"><line class="axis" x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}"/><path class="line" d="${d}"/>${coords.map(c=>`<circle class="dot" cx="${c[0]}" cy="${c[1]}" r="2.5"/>`).join('')}</svg><div class="subtitle">${esc(pts[0][0])} → ${esc(pts.at(-1)[0])} · ${esc(money(pts.at(-1)[1]))} known cumulative paid spend</div>`}
function render(){
  let all=allPerfs(),rows=filteredBase(),known=rows.filter(priced),currencyChoices=[...new Set(known.map(currencyNorm).filter(c=>c!=='Unpriced'))].sort();
  if(!currencyChoices.includes(filters.currency))filters.currency=currencyChoices.includes('USD')?'USD':(currencyChoices[0]||'USD');
  let moneyRows=known.filter(p=>currencyNorm(p)===filters.currency),paid=moneyRows.filter(isPaid),comps=rows.filter(isComp),prices=paid.map(amount),today=NOW,cy=today.slice(0,4),cm=today.slice(0,7),start12=new Date(today+'T12:00:00');
  start12.setMonth(start12.getMonth()-11);let start12k=start12.toISOString().slice(0,7);
  let spend=paid.reduce((a,p)=>a+amount(p),0),ytd=paid.filter(p=>p.date.slice(0,4)===cy).reduce((a,p)=>a+amount(p),0),month=paid.filter(p=>p.date.slice(0,7)===cm).reduce((a,p)=>a+amount(p),0),t12=paid.filter(p=>p.date.slice(0,7)>=start12k&&p.date.slice(0,7)<=cm).reduce((a,p)=>a+amount(p),0);
  let years=new Map(),months=new Map(),shows=new Map(),types=new Map(),sources=new Map(),prods=new Map();
  paid.forEach(p=>{let v=amount(p),y=p.date.slice(0,4),m=p.date.slice(0,7);years.set(y,(years.get(y)||0)+v);months.set(m,(months.get(m)||0)+v);let sh=show(p),sr=sourceNorm(p),tt=ticketNorm(p),pt=prodNorm(p);for(let [map,k] of [[types,tt],[sources,sr],[prods,pt]])map.set(k,(map.get(k)||0)+v);let g=shows.get(sh)||{show:sh,spend:0,visits:0};g.spend+=v;g.visits++;shows.set(sh,g)});
  let yearItems=[...years].map(([k,v])=>({k,v})).sort((a,b)=>a.k.localeCompare(b.k)),monthKeys=[...months.keys()].sort(),monthFloor=monthKeys.length>24?monthKeys.at(-24):'',monthItems=[...months].filter(([k])=>k>=monthFloor).map(([k,v])=>({k,v})).sort((a,b)=>a.k.localeCompare(b.k)),showItems=[...shows.values()].sort((a,b)=>b.spend-a.spend),typeItems=[...types].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v),sourceItems=[...sources].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v),prodItems=[...prods].map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  let maxTicket=paid.length?paid.reduce((a,b)=>amount(a)>amount(b)?a:b):null,minTicket=paid.length?paid.reduce((a,b)=>amount(a)<amount(b)?a:b):null,topShow=showItems[0];
  let yearsOpt=[...new Set(all.map(p=>p.date.slice(0,4)))].sort(),showsOpt=Object.values(DB.shows||{}).sort((a,b)=>String(a.title).localeCompare(String(b.title))),currencyCoverage=[...new Map(known.map(p=>[currencyNorm(p),0]))];let cc=new Map();known.forEach(p=>cc.set(currencyNorm(p),(cc.get(currencyNorm(p))||0)+1));let coverageText=[...cc].sort().map(([c,n])=>`${n} ${c}`).join(' · ');
  document.getElementById('app').innerHTML=`<section class="hero"><h1>Money</h1><p class="subtitle">Known ticket spend only. Missing prices stay missing. Currency is never converted or combined across currencies.</p><div class="filters"><select id="year"><option value="all">All years</option>${yearsOpt.map(y=>`<option${filters.year===y?' selected':''}>${y}</option>`).join('')}</select><select id="show"><option value="all">All shows</option>${showsOpt.map(s=>`<option value="${s.id}"${filters.show===String(s.id)?' selected':''}>${esc(s.title)}</option>`).join('')}</select><select id="ticket">${options(all,ticketNorm,filters.ticket,'All ticket types')}</select><select id="source">${options(all,sourceNorm,filters.source,'All sources')}</select><select id="type">${options(all,prodNorm,filters.type,'All production types')}</select><select id="currency">${currencyChoices.map(c=>`<option value="${esc(c)}"${filters.currency===c?' selected':''}>${esc(c==='Unspecified'?'Currency unspecified':c)}</option>`).join('')}</select></div><div class="kpis"><div class="kpi"><b>${money(spend)}</b><span>Lifetime known spend · ${esc(filters.currency)}</span></div><div class="kpi"><b>${money(ytd)}</b><span>${cy} spend</span></div><div class="kpi"><b>${money(month)}</b><span>Current month</span></div><div class="kpi"><b>${money(t12)}</b><span>Trailing 12 months</span></div><div class="kpi"><b>${paid.length}</b><span>Paid tickets · ${esc(filters.currency)}</span></div><div class="kpi"><b>${comps.length}</b><span>Comps / free</span></div><div class="kpi"><b>${money(prices.length?prices.reduce((a,b)=>a+b,0)/prices.length:null)}</b><span>Average paid</span></div><div class="kpi"><b>${money(median(prices))}</b><span>Median paid</span></div><div class="kpi"><b>${maxTicket?money(amount(maxTicket)):'–'}</b><span>Highest ticket</span></div><div class="kpi"><b>${minTicket?money(amount(minTicket)):'–'}</b><span>Lowest non-zero</span></div></div><div class="coverage">Price recorded for <b>${known.length}</b> of <b>${rows.length}</b> matching performances${coverageText?' ('+esc(coverageText)+')':''}. Spend charts show <b>${esc(filters.currency)}</b> only. ${comps.length} are identified as comps/free; no value is assigned to a comp unless a stored price exists.</div></section><section class="grid"><article class="card"><h2>Spend by year</h2>${barChart(yearItems,x=>x.v,x=>x.k)}</article><article class="card"><h2>Last 24 recorded months</h2>${barChart(monthItems,x=>x.v,x=>x.k,money,24)}</article><article class="card wide"><h2>Cumulative known spend</h2>${cumulativeSVG(moneyRows)}</article><article class="card"><h2>By ticket type</h2>${barChart(typeItems,x=>x.v,x=>x.k)}</article><article class="card"><h2>By source / vendor</h2>${barChart(sourceItems,x=>x.v,x=>x.k)}</article><article class="card"><h2>By production type</h2>${barChart(prodItems,x=>x.v,x=>x.k)}</article><article class="card"><h2>Quick callouts</h2><div class="callouts"><div class="callout"><b>${topShow?money(topShow.spend):'–'}</b><small>Most known spend on one show${topShow?' · '+esc(topShow.show):''}</small></div><div class="callout"><b>${maxTicket?money(amount(maxTicket)):'–'}</b><small>Most expensive single ticket${maxTicket?' · '+esc(show(maxTicket)):''}</small></div><div class="callout"><b>${comps.length}</b><small>Comp/free performances in filter</small></div><div class="callout"><b>${known.length}/${rows.length}</b><small>Known-price coverage</small></div></div></article><article class="card wide"><h2>Show breakdown</h2><div class="tableWrap"><table><thead><tr><th>Show</th><th>Paid visits</th><th>Known spend</th><th>Average paid</th></tr></thead><tbody>${showItems.map(x=>`<tr><td>${esc(x.show)}</td><td class="num">${x.visits}</td><td class="num">${money(x.spend)}</td><td class="num">${money(x.spend/x.visits)}</td></tr>`).join('')||'<tr><td colspan="4">No matching paid-price data.</td></tr>'}</tbody></table></div></article></section><div class="footer">Cuebook · B306 · v13.96.00 · Money uses stored   ['year','show','ticket','source','type','currency'].forEach(id=>document.getElementById(id).addEventListener('change',e=>{filters[id]=e.target.value;render()}));
